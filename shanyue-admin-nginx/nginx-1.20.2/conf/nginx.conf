# ============================================================
#  山月茶咖 · 管理端 nginx 配置（免安装版）
#  ------------------------------------------------------------
#  作用：① 托管管理端前端静态页面(html/admin)
#        ② 把 /api/ 开头的请求转发给后端 Spring Boot(8080)
#  例：浏览器请求 /api/employee/login
#        →  实际转发到 http://localhost:8080/admin/employee/login
#  （与 shanyue-vue3/admin 的 vite dev proxy 完全同款映射，
#    所以前端代码 dev 和部署环境零改动切换）
#  ------------------------------------------------------------
#  改端口：把下面 listen 80 改成如 listen 8081，执行 reload.bat
#  改后端：把三处 localhost:8080 换成你的后端地址
# ============================================================
worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 图片/文件上传大小限制（新增饮品图片用）
    client_max_body_size 20m;

    server {
        listen       80;
        server_name  localhost;

        # ---------- ① 管理端前端页面 ----------
        location / {
            root   html/admin;
            index  index.html index.htm;
            # 解决 Vue history 路由刷新 404 的问题
            try_files $uri $uri/ /index.html;
        }

        # ---------- ② 后端接口反向代理（核心） ----------
        # /api/ 前缀会被替换成 /admin/ 再转发（苍穹外卖模式）
        location /api/ {
            proxy_pass http://localhost:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------- ③ WebSocket（来单提醒/催单提醒） ----------
        location /ws/ {
            proxy_pass http://localhost:8080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ---------- ④ 后端上传的图片（饮品图/套餐图） ----------
        location /upload/ {
            proxy_pass http://localhost:8080/upload/;
        }
    }
}
